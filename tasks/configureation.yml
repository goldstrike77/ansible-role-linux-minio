---
- name: Add the group minio.
  group:
    name: "minio-user"
    gid: "{{ minio_arg.uid }}"

- name: Add the user minio.
  user:
    name: "minio-user"
    comment: "Running user for MinIO"
    create_home: "no"
    shell: "/sbin/nologin"
    uid: "{{ minio_arg.uid }}"
    group: "minio-user"

- name: Creating Minio events storage path.
  file:
    dest: "{{ minio_path }}/minio"
    state: "directory"
    owner: "minio-user"
    group: "minio-user"
    mode: "0750"

- name: Configure kernel parameters.
  sysctl:
    name: "{{ item.variable }}"
    value: "{{ item.value }}"
    state: "present"
    reload: "yes"
    sysctl_set: "yes"
    sysctl_file: "/etc/sysctl.d/20-sysctl.conf"
  loop: "{{ minio_kernel_parameters|flatten(levels=1) }}"

- name: Minio configure file transfer.
  template:
    src: "minio.default.j2"
    dest: "/etc/default/minio"
    owner: "minio-user"
    group: "minio-user"
    mode: "0640"
  no_log: true
  notify: Enable Minio service.

- name: Minio systemd service file transfer.
  template:
    src: "minio.service.j2"
    dest: "/lib/systemd/system/minio.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Enable Minio service.
